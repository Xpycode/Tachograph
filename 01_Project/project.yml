name: DownKeyCounter
options:
  bundleIdPrefix: dev.gmkonsortium
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: FDMSRXXN73
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO

targets:
  DownKeyCounter:
    type: application
    platform: macOS
    sources:
      - path: DownKeyCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gmkonsortium.DownKeyCounter
        PRODUCT_NAME: DownKeyCounter
        CODE_SIGN_ENTITLEMENTS: DownKeyCounter/DownKeyCounter.entitlements
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
        INFOPLIST_KEY_CFBundleDisplayName: DownKeyCounter

  DownKeyCounterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DownKeyCounterTests
    dependencies:
      - target: DownKeyCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gmkonsortium.DownKeyCounterTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DownKeyCounter.app/Contents/MacOS/DownKeyCounter"

schemes:
  DownKeyCounter:
    build:
      targets:
        DownKeyCounter: all
        DownKeyCounterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DownKeyCounterTests
    archive:
      config: Release

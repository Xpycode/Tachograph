name: Tachograph
options:
  bundleIdPrefix: com.lucesumbrarum
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: FDMSRXXN73
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.2.0

targets:
  Tachograph:
    type: application
    platform: macOS
    sources:
      - path: Tachograph
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucesumbrarum.Tachograph
        PRODUCT_NAME: Tachograph
        CODE_SIGN_ENTITLEMENTS: Tachograph/Tachograph.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Gregor Müller. All rights reserved."
        INFOPLIST_KEY_CFBundleDisplayName: Tachograph

  TachographTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TachographTests
    dependencies:
      - target: Tachograph
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucesumbrarum.TachographTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tachograph.app/Contents/MacOS/Tachograph"

schemes:
  Tachograph:
    build:
      targets:
        Tachograph: all
        TachographTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TachographTests
    archive:
      config: Release
